<style>
  :root {
    --umn-maroon: #7a0019;
    --umn-gold: #ffcc33;
    --ink: #1f2937;
    --muted: #6b7280;
    --card: #f8fafc;
    --line: #e5e7eb;
  }

  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: "Avenir Next", "Segoe UI", sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, #ffffff 0%, #f6f8fb 100%);
  }

  .container {
    padding: 14px;
  }

  h1 {
    font-size: 20px;
    margin: 0 0 6px;
    color: var(--umn-maroon);
  }

  h2 {
    font-size: 14px;
    margin: 0 0 10px;
    color: var(--ink);
  }

  .subtle {
    color: var(--muted);
    margin-top: 0;
    font-size: 12px;
  }

  .card {
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    padding: 12px;
    margin: 12px 0;
  }

  .card-toggle {
    cursor: pointer;
    user-select: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 0;
  }

  .card:not(.collapsed) .card-toggle {
    margin-bottom: 10px;
  }

  .card.collapsed .card-body {
    display: none;
  }

  .chevron {
    font-size: 10px;
    color: var(--muted);
    transition: transform 0.15s;
  }

  .card.collapsed .chevron {
    transform: rotate(-90deg);
  }

  label {
    display: block;
    font-size: 12px;
    margin: 8px 0 4px;
    font-weight: 600;
  }

  input,
  select,
  textarea {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 8px;
    font-size: 12px;
    background: #fff;
  }

  .row {
    margin-top: 10px;
    display: flex;
    gap: 8px;
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-weight: 600;
  }

  .checkbox-row input[type="checkbox"] {
    width: auto;
    margin: 0;
  }

  button {
    border: none;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    font-weight: 700;
    background: var(--umn-maroon);
    color: #fff;
    cursor: pointer;
  }

  button.secondary {
    background: #334155;
  }

  #message {
    min-height: 20px;
    font-size: 12px;
    color: #0f766e;
  }

  #message.error {
    color: #b91c1c;
  }
</style>
