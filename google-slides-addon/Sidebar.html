<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('SidebarStyles'); ?>
  </head>
  <body>
    <div class="container">
      <h1>ChimeIn for Slides</h1>
      <p class="subtle">Signed in as: <span id="userEmail"></span></p>

      <section class="card">
        <h2>Connection</h2>
        <label for="baseUrl">ChimeIn Base URL</label>
        <input id="baseUrl" type="url" placeholder="https://chimein.cla.umn.edu" />

        <label for="apiToken">API Token</label>
        <textarea id="apiToken" rows="3" placeholder="Paste personal API token"></textarea>

        <div class="row">
          <button id="saveTokenBtn">Save &amp; Validate</button>
        </div>
        <p id="authStatus" class="subtle"></p>
      </section>

      <section class="card">
        <h2>Insert QR Code</h2>
        <label for="qrChimeId">Chime</label>
        <select id="qrChimeId"></select>

        <label for="qrSize">QR Size</label>
        <select id="qrSize">
          <option value="200">Small (200)</option>
          <option value="300" selected>Medium (300)</option>
          <option value="400">Large (400)</option>
          <option value="500">XL (500)</option>
        </select>

        <label for="qrLayout">Layout</label>
        <select id="qrLayout">
          <option value="left" selected>Left</option>
          <option value="center">Center</option>
          <option value="right">Right</option>
        </select>

        <label class="checkbox-row" for="qrIncludeJoinText">
          <input id="qrIncludeJoinText" type="checkbox" checked />
          Include join instructions below QR
        </label>

        <label class="checkbox-row" for="qrAllowFallback">
          <input id="qrAllowFallback" type="checkbox" checked />
          Use fallback QR provider if API image fails
        </label>

        <div class="row">
          <button id="refreshChimesBtn" class="secondary">Refresh Chimes</button>
          <button id="insertQrBtn">Insert QR</button>
        </div>
      </section>

      <section class="card">
        <h2>Insert Results</h2>
        <label for="resultsChimeId">Chime</label>
        <select id="resultsChimeId"></select>
        <label for="sessionId">Open Session</label>
        <select id="sessionId"></select>

        <label for="resultsDisplayMode">Display Mode</label>
        <select id="resultsDisplayMode">
          <option value="table" selected>Table</option>
          <option value="text">Text Summary</option>
          <option value="both">Both</option>
        </select>

        <label for="resultsLayout">Layout</label>
        <select id="resultsLayout">
          <option value="right" selected>Right Panel</option>
          <option value="full">Full Width</option>
        </select>

        <label class="checkbox-row" for="liveRefreshEnabled">
          <input id="liveRefreshEnabled" type="checkbox" />
          Enable live refresh while sidebar is open
        </label>

        <label for="liveRefreshSeconds">Live Refresh Interval (seconds)</label>
        <select id="liveRefreshSeconds">
          <option value="5" selected>5 seconds</option>
          <option value="10">10 seconds</option>
          <option value="15">15 seconds</option>
          <option value="30">30 seconds</option>
        </select>

        <div class="row">
          <button id="refreshSessionsBtn" class="secondary">Refresh Sessions</button>
          <button id="insertResultsBtn">Insert Results</button>
        </div>
        <div class="row">
          <button id="startLiveBtn" class="secondary">Start Live</button>
          <button id="stopLiveBtn" class="secondary">Stop Live</button>
        </div>
        <p id="liveStatus" class="subtle">Live refresh is off.</p>
      </section>

      <p id="message" role="status" aria-live="polite"></p>
    </div>

    <script>
      window.__USER_EMAIL__ = <?!= JSON.stringify(userEmail) ?>;
      window.__BASE_URL__ = <?!= JSON.stringify(baseUrl) ?>;
    </script>
    <?!= include('SidebarScript'); ?>
  </body>
</html>
