<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      :root {
        --maroon: #7a0019;
        --gold: #ffcc33;
        --ink: #1f2937;
        --muted: #6b7280;
        --line: #e5e7eb;
        --bg: #f8fafc;
        --green: #0f766e;
        --red: #b91c1c;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        color: var(--ink);
        background: #fff;
        padding: 16px;
        font-size: 13px;
      }
      h2 {
        font-size: 14px;
        color: var(--maroon);
        margin-bottom: 4px;
        line-height: 1.4;
      }
      .meta {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .meta-right { display: flex; gap: 8px; align-items: center; }
      select {
        font-size: 11px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 3px 6px;
        background: #fff;
        color: var(--ink);
      }
      button {
        border: none;
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        background: var(--maroon);
        color: #fff;
      }
      button.secondary { background: #334155; }

      /* Bar chart */
      .results-list { list-style: none; width: 100%; }
      .results-list li { margin-bottom: 10px; }
      .bar-label {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        margin-bottom: 3px;
      }
      .bar-track {
        background: var(--line);
        border-radius: 4px;
        height: 14px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        background: var(--maroon);
        border-radius: 4px;
        transition: width 0.4s ease;
        min-width: 2px;
      }

      /* Free response list */
      .response-list {
        max-height: 260px;
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
        background: var(--bg);
      }
      .response-item {
        padding: 5px 0;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        line-height: 1.4;
      }
      .response-item:last-child { border-bottom: none; }

      /* Slider */
      .stat-row {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .stat {
        text-align: center;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 16px;
      }
      .stat-value { font-size: 22px; font-weight: 700; color: var(--maroon); }
      .stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; }

      .status-bar {
        font-size: 11px;
        margin-top: 12px;
        color: var(--muted);
        text-align: right;
      }
      .status-bar.error { color: var(--red); }
      .spinner {
        display: inline-block;
        width: 10px; height: 10px;
        border: 2px solid var(--line);
        border-top-color: var(--maroon);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        vertical-align: middle;
        margin-right: 4px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .empty { color: var(--muted); font-size: 12px; padding: 8px 0; }
    </style>
  </head>
  <body>
    <h2 id="questionText">Loading…</h2>
    <div class="meta">
      <span id="responseCount"></span>
      <div class="meta-right">
        <select id="intervalSelect">
          <option value="5000">5s</option>
          <option value="10000" selected>10s</option>
          <option value="15000">15s</option>
          <option value="30000">30s</option>
        </select>
        <button id="refreshNowBtn" class="secondary">↺ Now</button>
      </div>
    </div>
    <div id="navBar" class="meta" style="display:none">
      <button id="prevBtn" class="secondary" style="padding:3px 8px">←</button>
      <span id="navLabel" style="font-size:11px;color:var(--muted)"></span>
      <button id="nextBtn" class="secondary" style="padding:3px 8px">→</button>
    </div>

    <div id="resultsContainer"></div>

    <div id="statusBar" class="status-bar"></div>

    <script>
      var chimeId = <?!= JSON.stringify(chimeId) ?>;
      var sessionId = <?!= JSON.stringify(sessionId) ?>;
      var sessionList = <?!= JSON.stringify(sessionList) ?>;
      var currentIndex = (function () {
        for (var i = 0; i < sessionList.length; i++) {
          if (sessionList[i].id === sessionId) return i;
        }
        return 0;
      })();
      var pollTimer = null;
      var isRefreshing = false;

      function updateNavBar() {
        var nav = document.getElementById('navBar');
        if (sessionList.length <= 1) { nav.style.display = 'none'; return; }
        nav.style.display = 'flex';
        document.getElementById('navLabel').textContent = (currentIndex + 1) + ' of ' + sessionList.length;
        document.getElementById('prevBtn').disabled = currentIndex === 0;
        document.getElementById('nextBtn').disabled = currentIndex === sessionList.length - 1;
      }

      function navigateTo(index) {
        if (index < 0 || index >= sessionList.length) return;
        currentIndex = index;
        sessionId = sessionList[currentIndex].id;
        updateNavBar();
        stopPolling();
        refresh();
        startPolling();
      }

      function setStatus(msg, isError) {
        var el = document.getElementById('statusBar');
        el.className = 'status-bar' + (isError ? ' error' : '');
        el.innerHTML = isError ? msg : msg;
      }

      function setLoading() {
        setStatus('<span class="spinner"></span> Refreshing…', false);
      }

      function pct(n, total) {
        return total > 0 ? Math.round((n / total) * 100) : 0;
      }

      function renderMultipleChoice(data) {
        var total = data.total_responses || 0;
        var choices = (data.results && data.results.choices) || [];
        if (!choices.length) {
          return '<p class="empty">No responses yet.</p>';
        }
        var html = '<ul class="results-list">';
        choices.forEach(function (c) {
          var p = pct(c.count, total);
          html += '<li>' +
            '<div class="bar-label"><span>' + escapeHtml(stripTags(c.choice || c.text || '')) + '</span><span>' + c.count + ' (' + p + '%)</span></div>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + p + '%"></div></div>' +
            '</li>';
        });
        html += '</ul>';
        return html;
      }

      function renderFreeResponse(data) {
        var responses = (data.results && data.results.responses) || [];
        if (!responses.length) {
          return '<p class="empty">No responses yet.</p>';
        }
        var html = '<div class="response-list">';
        responses.forEach(function (r) {
          html += '<div class="response-item">' + escapeHtml(r.text || '') + '</div>';
        });
        html += '</div>';
        return html;
      }

      function renderSlider(data) {
        var r = (data.results && !Array.isArray(data.results)) ? data.results : {};
        if (!r.count && r.count !== 0) return '<p class="empty">No responses yet.</p>';
        if (r.count === 0) return '<p class="empty">No responses yet.</p>';
        var html = '<div class="stat-row">';
        html += '<div class="stat"><div class="stat-value">' + Number(r.average).toFixed(1) + '</div><div class="stat-label">Average</div></div>';
        html += '<div class="stat"><div class="stat-value">' + r.min + '</div><div class="stat-label">Min</div></div>';
        html += '<div class="stat"><div class="stat-value">' + r.max + '</div><div class="stat-label">Max</div></div>';
        if (r.median !== undefined) {
          html += '<div class="stat"><div class="stat-value">' + r.median + '</div><div class="stat-label">Median</div></div>';
        }
        html += '</div>';
        return html;
      }

      function renderNumericResponse(data) {
        var r = data.results || {};
        if (!r.count) return '<p class="empty">No responses yet.</p>';

        var html = '<div class="stat-row">';
        html += '<div class="stat"><div class="stat-value">' + Number(r.average).toFixed(1) + '</div><div class="stat-label">Average</div></div>';
        html += '<div class="stat"><div class="stat-value">' + r.min + '</div><div class="stat-label">Min</div></div>';
        html += '<div class="stat"><div class="stat-value">' + r.max + '</div><div class="stat-label">Max</div></div>';
        html += '</div>';

        var freq = r.frequency || [];
        if (freq.length) {
          var maxCount = Math.max.apply(null, freq.map(function(f) { return f.count; }));
          html += '<ul class="results-list">';
          freq.forEach(function(f) {
            var p = maxCount > 0 ? Math.round((f.count / maxCount) * 100) : 0;
            html += '<li>' +
              '<div class="bar-label"><span>' + f.value + '</span><span>' + f.count + '</span></div>' +
              '<div class="bar-track"><div class="bar-fill" style="width:' + p + '%"></div></div>' +
              '</li>';
          });
          html += '</ul>';
        }
        return html;
      }

      function renderImageResponse(data) {
        var images = (data.results && data.results.images) || [];
        if (!images.length) return '<p class="empty">No images submitted yet.</p>';
        var html = '<ul class="results-list">';
        images.forEach(function (img) {
          html += '<li><div class="bar-label"><span>' + escapeHtml(img.user || 'Anonymous') + '</span>' +
            '<span style="color:#6b7280;font-size:11px">' + escapeHtml(img.image_name || '') + '</span></div></li>';
        });
        html += '</ul>';
        return html;
      }

      function renderHeatmap(data) {
        var r = data.results || {};
        var coords = r.coordinates || [];
        var clusters = r.clusters || [];
        if (!coords.length) return '<p class="empty">No responses yet.</p>';

        var html = '<div class="stat-row">';
        html += '<div class="stat"><div class="stat-value">' + coords.length + '</div><div class="stat-label">Points</div></div>';
        html += '<div class="stat"><div class="stat-value">' + clusters.length + '</div><div class="stat-label">Clusters</div></div>';
        html += '</div>';

        // Normalise coordinates to a 220×140 SVG viewport
        var xs = coords.map(function(c) { return c.x; });
        var ys = coords.map(function(c) { return c.y; });
        var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
        var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
        var rangeX = maxX - minX || 1, rangeY = maxY - minY || 1;
        var W = 220, H = 140, PAD = 10;
        function nx(v) { return PAD + ((v - minX) / rangeX) * (W - 2 * PAD); }
        function ny(v) { return PAD + ((v - minY) / rangeY) * (H - 2 * PAD); }

        html += '<svg width="' + W + '" height="' + H + '" style="display:block;margin:8px auto;border:1px solid #e5e7eb;border-radius:8px;background:#f8fafc">';
        clusters.forEach(function (cl) {
          var cx = nx(cl.center.x), cy = ny(cl.center.y);
          var r2 = Math.max(8, Math.min(30, cl.count * 4));
          html += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + r2 + '" fill="#7a001933" stroke="#7a0019" stroke-width="1"/>';
          html += '<text x="' + cx.toFixed(1) + '" y="' + (cy + 4).toFixed(1) + '" text-anchor="middle" font-size="10" fill="#7a0019">' + cl.count + '</text>';
        });
        coords.forEach(function (c) {
          html += '<circle cx="' + nx(c.x).toFixed(1) + '" cy="' + ny(c.y).toFixed(1) + '" r="3" fill="#33415580" stroke="none"/>';
        });
        html += '</svg>';
        return html;
      }

      function renderTextHeatmap(data) {
        var r = data.results || {};
        var ranges = r.ranges || [];
        if (!ranges.length) return '<p class="empty">No responses yet.</p>';

        var rawText = (data.question && data.question.question_info &&
          data.question.question_info.question_responses &&
          data.question.question_info.question_responses.heatmap_text) || '';
        var plainText = rawText.replace(/<[^>]+>/g, '');

        var top = ranges.slice(0, 8);
        var html = '<ul class="results-list">';
        top.forEach(function (range) {
          var snippet = plainText.slice(range.start_offset, range.end_offset) || '';
          html += '<li>' +
            '<div class="bar-label"><span>&ldquo;' + escapeHtml(snippet) + '&rdquo;</span><span>' + range.count + '</span></div>' +
            '</li>';
        });
        html += '</ul>';
        return html;
      }

      function renderResults(data) {
        var type = data.question && data.question.type;
        switch (type) {
          case 'multiple_choice':       return renderMultipleChoice(data);
          case 'free_response':         return renderFreeResponse(data);
          case 'slider_response':
          case 'slider':                return renderSlider(data);
          case 'numeric_response':      return renderNumericResponse(data);
          case 'image_response':        return renderImageResponse(data);
          case 'heatmap_response':      return renderHeatmap(data);
          case 'text_heatmap_response': return renderTextHeatmap(data);
          default:                      return renderFreeResponse(data);
        }
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function refresh() {
        if (isRefreshing) return;
        isRefreshing = true;
        setLoading();
        google.script.run
          .withSuccessHandler(function (data) {
            isRefreshing = false;
            if (!data) { setStatus('No data returned.', true); return; }
            var q = data.question || {};
            document.getElementById('questionText').textContent =
              stripTags(q.text || 'ChimeIn Results');
            document.getElementById('responseCount').textContent =
              (data.total_responses || 0) + ' response' + (data.total_responses !== 1 ? 's' : '');
            document.getElementById('resultsContainer').innerHTML = renderResults(data);
            setStatus('Updated ' + new Date().toLocaleTimeString(), false);
          })
          .withFailureHandler(function (err) {
            isRefreshing = false;
            setStatus('Error: ' + (err.message || String(err)), true);
          })
          .fetchResultsForDialog(chimeId, sessionId);
      }

      function stripTags(html) {
        var tmp = document.createElement('div');
        tmp.innerHTML = html;
        return tmp.textContent || tmp.innerText || '';
      }

      function startPolling() {
        stopPolling();
        var ms = Number(document.getElementById('intervalSelect').value);
        pollTimer = setInterval(refresh, ms);
      }

      function stopPolling() {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      }

      document.getElementById('intervalSelect').addEventListener('change', function () {
        startPolling();
      });
      document.getElementById('refreshNowBtn').addEventListener('click', refresh);
      document.getElementById('prevBtn').addEventListener('click', function () { navigateTo(currentIndex - 1); });
      document.getElementById('nextBtn').addEventListener('click', function () { navigateTo(currentIndex + 1); });

      // Initial load + start polling
      updateNavBar();
      refresh();
      startPolling();
    </script>
  </body>
</html>
