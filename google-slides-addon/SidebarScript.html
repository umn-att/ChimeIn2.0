<script>
  var cachedChimes = [];


  function setMessage(text, isError) {
    var message = document.getElementById('message');
    message.textContent = text || '';
    message.className = isError ? 'error' : '';
  }

  function setSelectOptions(selectId, options, placeholder) {
    var select = document.getElementById(selectId);
    select.innerHTML = '';

    var emptyOption = document.createElement('option');
    emptyOption.value = '';
    emptyOption.textContent = placeholder;
    select.appendChild(emptyOption);

    options.forEach(function (option) {
      var el = document.createElement('option');
      el.value = option.value;
      el.textContent = option.label;
      select.appendChild(el);
    });
  }

  async function loadChimes() {
    var chimes = await callServer('getSidebarChimeOptions');
    cachedChimes = Array.isArray(chimes) ? chimes : [];

    var selectOptions = cachedChimes.map(function (chime) {
      var suffix = chime.accessCode ? ' (code ' + chime.accessCode + ')' : '';
      return {
        value: chime.id,
        label: chime.name + suffix
      };
    });

    setSelectOptions('qrChimeId', selectOptions, 'Select a Chime');
    setSelectOptions('resultsChimeId', selectOptions, 'Select a Chime');

    return cachedChimes.length;
  }

  async function loadSessionsForSelectedChime() {
    var chimeId = document.getElementById('resultsChimeId').value;
    if (!chimeId) {
      setSelectOptions('sessionId', [], 'Select a Chime first');
      return 0;
    }

    var sessions = await callServer('getSidebarSessionOptions', [chimeId]);
    var options = (sessions || []).map(function (session) {
      var prefix = session.folderName ? '[' + session.folderName + '] ' : '';
      return {
        value: session.id,
        label: prefix + session.questionText
      };
    });

    setSelectOptions('sessionId', options, options.length ? 'Select an open session' : 'No open sessions');
    return options.length;
  }

  function callServer(fnName, args) {
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) {
          reject(err && err.message ? err.message : String(err));
        });

      if (!args || !args.length) {
        runner[fnName]();
      } else {
        runner[fnName].apply(runner, args);
      }
    });
  }

  async function init() {
    document.getElementById('userEmail').textContent = window.__USER_EMAIL__ || 'unknown';
    document.getElementById('baseUrl').value = window.__BASE_URL__ || '';

    try {
      var status = await callServer('getAuthStatus');
      document.getElementById('authStatus').textContent = status.hasToken
        ? 'Token is saved.'
        : 'No token saved yet.';

      if (status.hasToken) {
        var chimeCount = await loadChimes();
        setMessage('Loaded ' + chimeCount + ' chimes.');
      } else {
        setSelectOptions('qrChimeId', [], 'Save and validate token first');
        setSelectOptions('resultsChimeId', [], 'Save and validate token first');
        setSelectOptions('sessionId', [], 'Save and validate token first');
      }
    } catch (e) {
      setMessage(e, true);
    }
  }

  document.getElementById('saveTokenBtn').addEventListener('click', async function () {
    setMessage('Saving and validating...');
    try {
      var result = await callServer('saveConnectionSettings', [
        document.getElementById('baseUrl').value,
        document.getElementById('apiToken').value
      ]);
      document.getElementById('authStatus').textContent = 'Token is saved and valid.';
      var chimeCount = await loadChimes();
      setMessage('Connection saved. Chimes available: ' + chimeCount + '.');
    } catch (e) {
      document.getElementById('authStatus').textContent = 'Token validation failed.';
      setMessage(e, true);
    }
  });

  document.getElementById('refreshChimesBtn').addEventListener('click', async function () {
    setMessage('Refreshing chimes...');
    try {
      var count = await loadChimes();
      setMessage('Chime list updated (' + count + ').');
    } catch (e) {
      setMessage(e, true);
    }
  });

  document.getElementById('resultsChimeId').addEventListener('change', async function () {
    try {
      await loadSessionsForSelectedChime();
    } catch (e) {
      setMessage(e, true);
    }
  });

  document.getElementById('showResultsBtn').addEventListener('click', async function () {
    var chimeId = document.getElementById('resultsChimeId').value;
    var sessionId = document.getElementById('sessionId').value;
    if (!chimeId || !sessionId) {
      setMessage('Select both a Chime and an open Session first.', true);
      return;
    }
    setMessage('Loading results...');
    try {
      await callServer('showLiveResultsDialog', [chimeId, sessionId]);
      setMessage('');
    } catch (e) {
      setMessage(e, true);
    }
  });

  document.getElementById('insertQrBtn').addEventListener('click', async function () {
    setMessage('Inserting QR code...');
    try {
      var chimeId = document.getElementById('qrChimeId').value;
      if (!chimeId) {
        throw new Error('Select a Chime first.');
      }
      var options = {
        size: Number(document.getElementById('qrSize').value || 300),
        format: 'png',
        layout: document.getElementById('qrLayout').value || 'left',
        includeJoinText: document.getElementById('qrIncludeJoinText').checked,
        allowFallback: document.getElementById('qrAllowFallback').checked
      };

      var result = await callServer('insertQrCodeForChime', [chimeId, options]);
      if (result && result.fallbackUsed) {
        setMessage('QR code inserted (fallback provider used).');
      } else {
        setMessage('QR code inserted.');
      }
    } catch (e) {
      setMessage(e, true);
    }
  });

  init();
</script>
